<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script defer type="module" src="/src/main.jsx"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="shortcut icon" type="image/webp" href="/favicon.webp" />
    <link rel="apple-touch-icon" href="/favicon.webp" />

    <!-- Additional meta tags -->
    <meta name="theme-color" content="#2a1653" />

      name="description"
      content="Yekta Akhavan — Frontend Developer building clean, modern and responsive interfaces with React and Tailwind CSS."
    />
    <link rel="canonical" href="https://yektaakhavan.github.io/My-Portfolio/" />

    <!-- Open Graph meta tags -->
    <meta property="og:title" content="Yekta Akhavan - Frontend Developer" />
    <meta
      property="og:description"
      content="Frontend Developer | Creative Technologist — clean, modern and responsive interfaces built with React and Tailwind CSS."

    <meta name="twitter:card" content="summary" />

      name="twitter:description"

        "jobTitle": "Frontend Developer",
        "url": "https://yektaakhavan.github.io/My-Portfolio/",
        "sameAs": [
          "https://github.com/yektaakhavan",
          "https://linkedin.com/in/yekta-akhavan",
          "https://t.me/yektaa_akhavan"
        ]
      }
